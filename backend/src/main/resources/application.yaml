spring:
  application:
    name: bugtracker-backend

  datasource:
    url: jdbc:postgresql://localhost:15432/bugtracker
    username: bugtracker
    password: ${DB_PASSWORD:bugtracker_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: bugtracker-consumer
      auto-offset-reset: earliest

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info


app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400